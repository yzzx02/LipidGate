[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lipidgate"
version = "1.0.0"
description = "Lipid feature detection, MS2 identification and ordered ECN retention-time filtering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "pillow",
  "PySide6",
  "pymzml",
  "pyopenms",
  "PyYAML",
  "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lipidgate = "lipidgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
