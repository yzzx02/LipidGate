[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lipidgate"
dynamic = ["version"]
description = "Lipid feature detection, MS2 identification and ordered ECN retention-time filtering."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "yzzx02"}]
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "pillow",
  "PySide6",
  "pymzml",
  "pyopenms",
  "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
build = ["pyinstaller", "Cython==3.3.0"]

[project.urls]
Repository = "https://github.com/yzzx02/LipidGate"
Releases = "https://github.com/yzzx02/LipidGate/releases"
Issues = "https://github.com/yzzx02/LipidGate/issues"

[project.scripts]
lipidgate = "lipidgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lipidgate.__version__"}

[tool.setuptools.package-data]
lipidbench = ["runners/*.R"]
"lipidgate.ms2" = ["native_backend/*.cpp"]

[tool.setuptools.exclude-package-data]
"*" = ["*.dll", "*.pyd", "*.so", "*.dylib", "*.pyc", "*.pyo"]
"lipidgate.ms2" = ["native_backend/*.json", "native_backend/policy/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
