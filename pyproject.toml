[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lipidgate"
version = "1.0.2"
description = "Lipid feature detection, MS2 identification and ordered ECN retention-time filtering."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "yzzx02"}]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "pillow",
  "PySide6",
  "pymzml",
  "pyopenms",
  "PyYAML",
  "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
build = ["pyinstaller", "Cython==3.3.0"]

[project.urls]
Repository = "https://github.com/yzzx02/LipidGate"
Releases = "https://github.com/yzzx02/LipidGate/releases"
Issues = "https://github.com/yzzx02/LipidGate/issues"

[project.scripts]
lipidgate = "lipidgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lipidbench = ["runners/*.R"]
"lipidgate.ms2" = ["native_backend/*.cpp", "native_backend/*.dll", "native_backend/*.so", "native_backend/*.dylib", "native_backend/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
