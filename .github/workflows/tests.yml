name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install verified dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps -e .
      - name: Run regression suite
        run: python -m pytest -q --junitxml=build/verification/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-report
          path: build/verification/tests.xml
